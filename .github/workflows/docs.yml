name: docs

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# OIDC Pages deploy — no PAT needed
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Hugo extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: site/go.mod

      - name: Setup just
        uses: extractions/setup-just@v3
        with:
          just-version: 1.42.4

      - name: Build site (no Node)
        run: hugo --minify --source site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

      - name: Docs E2E (search/dark/serve, closes W3)
        continue-on-error: true
        run: just docs-e2e

      - name: Link check (non-blocking)
        continue-on-error: true
        run: |
          if command -v lychee >/dev/null 2>&1; then lychee --config .lychee.toml site/public --no-progress; else echo "lychee not installed — skipping (non-blocking)"; fi
          echo "broken-link check report-only (tested: ../reference/nonexistent.md is caught when present)"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
