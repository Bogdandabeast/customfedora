name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # Fast recipe validation: catches broken recipes in seconds, before the
  # (much slower) image build runs. Runs bluebuild validate on every recipe
  # that appears in the bluebuild matrix below.
  validate:
    name: Validate recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install BlueBuild CLI
        run: curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash

      - name: Install project deps (bun)
        run: bun install --frozen-lockfile

      - name: Validate all recipes
        run: |
          set -euo pipefail
          # Keep in sync with the bluebuild job matrix below.
          for recipe in recipe.niri.yml; do
            echo "==> Validating recipes/${recipe}"
            bluebuild validate "./recipes/${recipe}"
          done

  bluebuild:
    name: Build Custom Image
    needs: validate # don't waste a long build on a broken recipe
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          #- recipe.yml # temporarily disabled (only niri is built)
          - recipe.niri.yml
          #- recipe.nvidia.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
          # cache build layers in the registry to speed up repeat builds
          use_cache: true
          use_unstable_cli: false
          verify_install: false
