name: bluebuild-iso
on:
  schedule:
    - cron: "00 07 * * 0" # Sundays 07:00 UTC — a day after the weekly image build
  workflow_dispatch:    # allow manually triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  iso:
    name: Build ISO from recipe
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release asset
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.niri.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install BlueBuild CLI
        run: curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash

      - name: Generate ISO from recipe
        run: |
          set -euo pipefail

          sudo bluebuild generate-iso \
            --iso-name "${{ matrix.recipe }}.iso" \
            recipe "./recipes/${{ matrix.recipe }}"

          # bluebuild generate-iso writes the ISO under build/ by default.
          ISO="${{ matrix.recipe }}.iso"
          cp -v build/"$ISO" ./
          ls -lh "$ISO"

          # GitHub Releases hard limit is 2 GiB (2,147,483,648 bytes).
          # Check BEFORE attempting upload — a too-large ISO produces a cryptic
          # "Validation Failed" error from the upload action that's hard to debug.
          max_bytes=2147483648
          size=$(stat -c %s "$ISO")
          if (( size > max_bytes )); then
            echo "::error::ISO too large ($size bytes) for GitHub Releases (max $max_bytes bytes)"
            exit 1
          fi

      - name: Upload ISO as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.recipe }}.iso
          tag_name: isos
          name: Weekly ISOs
          draft: false
          prerelease: true
          generate_release_notes: false
          overwrite_files: true
