name: bluebuild-iso
on:
  schedule:
    - cron: "00 07 * * 0" # Sundays 07:00 UTC — a day after the weekly image build
  workflow_dispatch:    # allow manually triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  iso:
    name: Build ISO from recipe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.niri.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install BlueBuild CLI
        run: curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash

      - name: Generate ISO from recipe
        run: |
          set -uo pipefail

          sudo bluebuild generate-iso \
            --iso-name "${{ matrix.recipe }}.iso" \
            recipe "./recipes/${{ matrix.recipe }}"
          BUILD_EXIT=$?

          # Wait for any background processes and clean up
          if jobs -l | grep -q .; then
            wait
          fi

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::bluebuild generate-iso failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

          # bluebuild generate-iso bind-mounts the working directory at
          # /build-container-installer/build inside the installer container, so
          # the ISO lands in the current directory (the workspace root), not in
          # a build/ subdirectory.
          ISO="${{ matrix.recipe }}.iso"
          if [[ ! -f "$ISO" ]]; then
            echo "::error::ISO file $ISO not found after generation"
            exit 1
          fi

          ls -lh "$ISO"
          echo "ISO generated successfully: $ISO"

      # GitHub Releases caps each asset at 2 GiB, so a multi-GB installer ISO
      # cannot be attached to a release. Upload it as a workflow artifact
      # instead, which supports much larger files. retention-days is kept short
      # because each weekly ISO is several GB and artifact storage counts
      # against the repo's Actions storage quota. archive: false uploads the
      # raw ISO (no zip) so users get the .iso directly.
      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ matrix.recipe }}.iso
          if-no-files-found: error
          retention-days: 14
          archive: false
