name: bluebuild-iso
on:
  schedule:
    - cron: "00 07 * * 0" # Sundays 07:00 UTC — a day after the weekly image build
  workflow_dispatch:    # allow manually triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  iso:
    name: Build ISO from recipe
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release asset
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.niri.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install BlueBuild CLI
        run: curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash

      - name: Generate ISO from recipe
        run: |
          set -euo pipefail
          sudo bluebuild generate-iso \
            --iso-name "${{ matrix.recipe }}.iso" \
            recipe "./recipes/${{ matrix.recipe }}"

      - name: Upload ISO as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.recipe }}.iso
          tag_name: isos
          name: Weekly ISOs
          draft: false
          prerelease: true
          generate_release_notes: false
          overwrite_files: true
