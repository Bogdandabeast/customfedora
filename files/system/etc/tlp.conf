# --------------------------------------------------------------------
# TLP - Configuración optimizada siguiendo la guía oficial
# Objetivo: máxima duración de batería
# --------------------------------------------------------------------

TLP_ENABLE=1
TLP_WARN_LEVEL=3

# ---------------- CPU Energy/Performance Policy ----------------
# Guía: usar "power" en BAT y SAV

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# ---------------- Plataforma (Platform Profile) ----------------
# Guía: low-power en BAT y SAV

PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power
PLATFORM_PROFILE_ON_SAV=low-power

# ---------------- Turbo Boost ----------------
# Guía: desactivar turbo en BAT y SAV

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_BOOST_ON_SAV=0

CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_SAV=0

# ---------------- AMD GPU ABM ----------------
# Guía: nivel 3 en BAT y SAV (si aplica)

AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=3
AMDGPU_ABM_LEVEL_ON_SAV=3

# ---------------- WiFi Power Save ----------------
# Guía: activar ahorro en AC y BAT

WIFI_PWR_ON_AC=on
WIFI_PWR_ON_BAT=on

# ---------------- Runtime Power Management ----------------
# Guía: activar en AC y BAT para reducir consumo

RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# ---------------- Límites de rendimiento CPU ----------------
# Guía: opcional para limitar consumo bajo carga

CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=30
CPU_MAX_PERF_ON_SAV=20

CPU_MIN_PERF_ON_AC=0
CPU_MIN_PERF_ON_BAT=0
CPU_MIN_PERF_ON_SAV=0

# ---------------- Sonido ----------------

SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# ---------------- USB Autosuspend ----------------

USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_PRINTER=1

# ---------------- Discos ----------------

DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"

AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_TIMEOUT=15

# ---------------- Batería ----------------

START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
RESTORE_THRESHOLDS_ON_BAT=1

# --------------------------------------------------------------------
# Fin del archivo
# --------------------------------------------------------------------
