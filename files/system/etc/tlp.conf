###############################################
# TLP CUSTOM CONFIG
# AMD Ryzen 7 7730U
# AC = máximo rendimiento
# BAT = ahorro
###############################################

TLP_ENABLE=1

# Por defecto usar modo BAT (ahorro)
TLP_DEFAULT_MODE=BAT
TLP_PERSISTENT_DEFAULT=1

###############################################
# CPU
###############################################

# Governor: rendimiento en AC, ahorro en BAT
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Turbo (CPB) desactivado siempre
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Política de energía AMD
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

###############################################
# GPU AMD integrada
###############################################

RADEON_DPM_PERF_LEVEL_ON_AC=performance
RADEON_DPM_PERF_LEVEL_ON_BAT=auto

###############################################
# WiFi – Rendimiento
###############################################

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

###############################################
# USB – Ahorro
###############################################

USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_PRINTER=1

###############################################
# Audio – Ahorro seguro
###############################################

SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=0
SOUND_POWER_SAVE_CONTROLLER=Y

###############################################
# PCIe Runtime PM
###############################################

RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

###############################################
# Suspensión – deep sleep
###############################################

MEM_SLEEP_ON_AC=deep
MEM_SLEEP_ON_BAT=deep
