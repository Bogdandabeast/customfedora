---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: niri
description: Fedora Atomic with Niri compositor and Noctalia Shell

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # Desktop shell and compositor support
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - zed.repo
        - vstudio.repo
        - docker-ce.repo
        - https://pkg.cloudflareclient.com/cloudflare-warp-ascii.repo
    install:
      skip-broken: true
      packages:
        - niri
        - noctalia
        - alacritty
        - kanshi
        - xwayland-satellite
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - grim
        - slurp
        - wl-clipboard
        - playerctl
        # Editors / dev tooling (external repos)
        - zed
        - code
        # Prereqs for the WinBoat install script
        - curl
        - jq
        # Dependency of the Noctalia warp plugin (provides warp-cli)
        - cloudflare-warp
        # PAM module to auto-unlock the GNOME keyring at login (used by plasmalogin)
        - gnome-keyring-pam
        # Container engine (docker-ce repo; same stack as the sway recipe)
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - podman-compose
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # Install WinBoat from its latest GitHub RPM release
  - type: script
    scripts:
      - downloadlatestwinboatrpm.sh

  # Homebrew / Linuxbrew (installs brew at first boot via brew-setup.service).
  # fish is then installed from brew by brew-install-fish.service (see files/system).
  - type: brew
    brew-analytics: false

  # Systemd services (WARP daemon + container sockets, as in the sway recipe)
  - type: systemd
    system:
      enabled:
        - warp-svc.service
        - brew-install-fish.service
        - docker.socket
        - podman.socket

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - org.gimp.GIMP
          - org.libreoffice.LibreOffice
          - com.brave.Browser
      - scope: user

  - type: signing
