---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: niri
description: Fedora Atomic with Niri compositor and Noctalia Shell

# ublue base-main: minimal Fedora Atomic (no desktop environment).
# Everything the Niri/Noctalia desktop needs that Kinoite used to provide
# implicitly (login manager, keyring, file manager, gvfs, power profiles,
# xdg-user-dirs, Qt Wayland support) is installed explicitly below.
base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  # Desktop shell and compositor support
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - zed.repo
        - vstudio.repo
        - docker-ce.repo
        - https://pkg.cloudflareclient.com/cloudflare-warp-ascii.repo
    install:
      skip-broken: true
      packages:
        - niri
        - noctalia
        - alacritty
        - kanshi
        - xwayland-satellite
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - grim
        - slurp
        - wl-clipboard
        - playerctl
        # Login manager (ublue base has no display manager; sddm self-enables
        # and Conflicts with getty@tty1).
        - sddm
        - sddm-themes
        - qt5-qtgraphicaleffects
        - qt5-qtquickcontrols2
        - qt5-qtsvg
        # File manager + mounting stack (Kinoite shipped Dolphin; base has none).
        # Nautilus matches the GTK/GNOME portal + keyring stack; gvfs provides
        # trash, automount (udisks2 is already in base) and remote mounts.
        - nautilus
        - file-roller
        - gvfs
        - gvfs-archive
        - gvfs-fuse
        - gvfs-mtp
        - gvfs-nfs
        - gvfs-smb
        # GNOME keyring daemon (pam module already below; SDDM's PAM service
        # shipped by Fedora already hooks pam_gnome_keyring for auto-unlock)
        - gnome-keyring
        # Power profiles for the Noctalia power_profile widget (Kinoite shipped
        # power-profiles-daemon; base does not; it self-enables on install)
        - power-profiles-daemon
        # Creates ~/Pictures etc. so niri's screenshot path works out of the box
        - xdg-user-dirs

        # Qt Wayland platform for any RPM Qt apps (greeter/shell are fine without)
        - qt5-qtwayland
        - qt6-qtwayland

        # Volume GUI fallback (Noctalia's volume IPC is unreliable with BT sinks)
        - pavucontrol
        # CLI tools migrated from Homebrew — all available as Fedora RPMs
        # (verified on F44), so they're system-wide and update with the image.
        - gh
        - neovim
        - tmux
        - fzf
        - bat
        - btop
        - fastfetch
        - zoxide
        - yt-dlp
        - fd-find
        - ripgrep
        - distrobox
        # Editors / dev tooling (external repos)
        - zed
        - code
        # Prereqs for the WinBoat install script
        - curl
        - jq
        # Dependency of the Noctalia warp plugin (provides warp-cli)
        - cloudflare-warp
        # PAM module that auto-unlocks the GNOME keyring at SDDM login
        # (Fedora's /etc/pam.d/sddm already references pam_gnome_keyring)
        - gnome-keyring-pam
        # Container engine (docker-ce repo; same stack as the sway recipe)
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - podman-compose
        # Virtualization — full VM stack (libvirt + QEMU device support)
        - virt-manager
        - libvirt-daemon-driver-network
        - libvirt-daemon-driver-nodedev
        - libvirt-daemon-driver-qemu
        - libvirt-daemon-driver-storage-core
        - qemu-audio-spice
        - qemu-char-spice
        - qemu-device-display-qxl
        - qemu-device-display-virtio-gpu
        - qemu-device-display-virtio-vga
        - qemu-device-usb-redirect
        - qemu-system-x86-core
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # Install WinBoat from its latest GitHub RPM release
  - type: script
    scripts:
      - downloadlatestwinboatrpm.sh

  # Homebrew / Linuxbrew (installs brew at first boot via brew-setup.service).
  # fish, lazygit, lazydocker and bun are then installed from brew by
  # brew-install-fish.service / brew-install-cli.service (see files/system).
  - type: brew
    brew-analytics: false

  - type: justfiles

  # Systemd services (WARP daemon + container sockets, as in the sway recipe)
  - type: systemd
    user:
      enabled:
        # Keeps the Noctalia navbar widget (suspend on/off) in sync with lid.conf
        - noctalia-lid-mode-sync.service
    system:
      enabled:
        - warp-svc.service
        - brew-install-fish.service
        - brew-install-cli.service
        - docker.socket
        - podman.socket
        # libvirt daemon (needed by virt-manager; group setup is in vm-setup.just)
        - libvirtd.service
        # Power profiles (self-enables on install, but ensure it stays enabled;
        # Kinoite ships it masked and that state survives rebases)
        - power-profiles-daemon.service
        # Note: Ryzen 7730U tuning (6W/15W/9W + EC 80% + LAVD) lives only in
        # recipe.niri-cachyos.yml — this generic niri image is for other machines.

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # Flatpaks installed at first boot (boot-install) instead of image build
          # to keep the ISO size down. They update with the system but are not
          # part of the base image layers.
          - com.brave.Browser
          # Referenced by the niri config (shortcut + window rules)
          - io.gitlab.librewolf-community
          - com.valvesoftware.Steam
          # Multimedia
          - org.videolan.VLC
          - com.dec05eba.gpu_screen_recorder
          # Security / tools
          - org.keepassxc.KeePassXC
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          # Gaming
          - com.heroicgameslauncher.hgl
          - ru.linux_gaming.PortProton
        boot-install: true
      - scope: user
