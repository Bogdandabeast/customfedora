---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: niri
description: Fedora Atomic with Niri compositor and Noctalia Shell

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # Desktop shell and compositor support
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - niri
        - noctalia
        - kanshi
        - xwayland-satellite
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - grim
        - slurp
        - wl-clipboard
        - playerctl
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - org.gimp.GIMP
          - org.libreoffice.LibreOffice
          - com.brave.Browser
      - scope: user

  - type: signing
