---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: sway
description: My personal Fedora Sericea (Sway Atomic) custom image.

base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44

modules:
  # Module 1: Files overlay (configs)
  - type: files
    files:
      - source: system
        destination: /

  # Module 2: DNF with external repos (auto-cleaned after install)
  - type: dnf
    repos:
      cleanup: true
      files:
        - docker-ce.repo
        - vstudio.repo
        - zed.repo
    install:
      allow-erasing: true
      skip-broken: true
      packages:
        # Dev tooling
        - distrobox
        - gh
        - tealdeer
        - chezmoi
        - neovim
        - tmux
        - zsh
        - fish
        # Terminal
        - alacritty
        # JavaScript runtime
        - nodejs
        - npm
        # Input + mounts
        - ydotool
        - fuse-sshfs
        # External repo packages
        - code
        - zed
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # Module 3: Winboat RPM
  - type: script
    scripts:
      - downloadlatestwinboatrpm.sh

  # Module 4: Flatpaks
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - org.gimp.GIMP
          - org.libreoffice.LibreOffice
          - org.audacityteam.Audacity
          - org.keepassxc.KeePassXC
          - io.gitlab.librewolf-community
          - com.brave.Browser
      - scope: user

  # Module 5: Systemd services
  - type: systemd
    system:
      enabled:
        - docker.socket
        - podman.socket

  # Module 6: Homebrew (installed at first boot via systemd)
  - type: brew
    brew-analytics: false
    nofile-limits: true

  # Module 7: Signing
  - type: signing
