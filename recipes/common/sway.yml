modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    install:
      packages:
        - sway
        - waybar
        - wofi
        - mako
        - mpd
        - mpv
        - feh
        - slurp
        - grim
        - swayidle
