# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
modules:
  # Este módulo copia archivos desde tu carpeta local "system"
  # hacia el sistema raíz de la imagen que estás construyendo.
  # Es útil para agregar configuraciones personalizadas, dotfiles,
  # servicios systemd, temas, etc.
  - type: script
    scripts:
      - downloadlatestwinboatrpm.sh
  - type: files
    files:
      - source: system
        destination: / # Copia todo lo que esté dentro de system/ al root (/) de la imagen

  # Este módulo instala paquetes usando DNF (el gestor de paquetes de Fedora).
  # Aquí estás instalando todo el entorno base para un setup de Sway en Wayland.
  - type: dnf
    repos:
      files:
        - https://pkg.cloudflareclient.com/cloudflare-warp-ascii.repo
    install:
      skip-broken: true
      packages:
        - cloudflare-warp
        # PAM module to auto-unlock the GNOME keyring at login (plasmalogin already references it)
        - gnome-keyring-pam
        # power manangment
        #- tlp
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.keepassxc.KeePassXC
          - io.gitlab.librewolf-community
          - com.brave.Browser
      - scope: user # Also add Flathub user repo, but no user packages
